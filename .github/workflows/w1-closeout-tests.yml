name: W1 Closeout Tests

on:
  push:
    branches:
      - closure/w1-action-safety

permissions:
  contents: read

jobs:
  focused-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout validated W1 test head
        uses: actions/checkout@v6
        with:
          ref: b910876083006e1a9526f9d0484d3cd10952cd5b
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install uv
        uses: astral-sh/setup-uv@v8.0.0
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --extra dev --extra framework-comparison --extra server

      - name: Build Rust extension
        run: uv run maturin develop --manifest-path rust/crates/openjarvis-python/Cargo.toml

      - name: Prepare runtime directory
        run: mkdir -p "$HOME/.openjarvis"

      - name: Canonicalization
        run: uv run pytest -q tests/tools/test_action_canonicalization.py

      - name: Manifest
        run: uv run pytest -q tests/tools/test_manifest.py

      - name: Action service
        run: uv run pytest -q tests/tools/test_action_service.py

      - name: Operator action service
        run: uv run pytest -q tests/tools/test_operator_action_service.py

      - name: Critical safety contracts
        run: |
          uv run pytest -q \
            tests/tools/test_operator_action_service.py::test_parallel_services_claim_same_action_once \
            tests/tools/test_operator_action_service.py::test_crash_after_effect_requires_recovery_without_reexecution \
            tests/tools/test_operator_action_service.py::test_startup_recovery_marks_every_inflight_effect_without_reexecution \
            tests/tools/test_operator_action_service.py::test_global_stop_cancels_inflight_action_and_blocks_late_revival \
            tests/tools/test_operator_action_service.py::test_failed_external_postcondition_is_recovery_not_success \
            tests/tools/test_operator_action_service.py::test_direct_execute_cannot_bypass_retry_policy \
            tests/tools/test_operator_action_service.py::test_persisted_risk_floor_and_manifest_snapshot_cannot_drop \
            tests/tools/test_operator_action_service.py::test_tool_output_cannot_lower_policy_and_secrets_are_redacted \
            tests/tools/test_manifest.py::test_manifest_rejects_level_four_execution
