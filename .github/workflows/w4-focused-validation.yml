name: W4 Focused Validation

on:
  push:
    branches:
      - closure/w4-validation-temp

permissions:
  contents: write

jobs:
  closeout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: closure/w4-server-policy
          fetch-depth: 0

      - name: Verify W4 source head
        run: test "$(git rev-parse HEAD)" = "67df088b8e279a908b0afa8de8da35c7a2c03b2d"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v8.0.0

      - name: Install dependencies
        run: uv sync --extra dev --extra framework-comparison --extra server

      - name: Format only W4 Python files
        run: >-
          uv run ruff format
          src/openjarvis/tools/_stubs.py
          tests/security/test_tool_confirmation.py
          tests/server/test_legacy_action_gateway.py

      - name: Targeted Ruff check after format
        run: >-
          uv run ruff check
          src/openjarvis/tools/_stubs.py
          tests/security/test_tool_confirmation.py
          tests/server/test_legacy_action_gateway.py

      - name: Targeted Ruff format check after format
        run: >-
          uv run ruff format --check
          src/openjarvis/tools/_stubs.py
          tests/security/test_tool_confirmation.py
          tests/server/test_legacy_action_gateway.py

      - name: Diff check including format changes
        run: git diff --check 26ed6fcf30fd1f2f2473c29b7fcd5e736a91931e

      - name: Commit targeted formatting to W4
        run: |
          git config user.name "JokerON165Hz"
          git config user.email "75010961+JokerON165Hz@users.noreply.github.com"
          git add src/openjarvis/tools/_stubs.py tests/security/test_tool_confirmation.py tests/server/test_legacy_action_gateway.py
          if git diff --cached --quiet; then
            echo "No format changes to commit"
          else
            git commit -m "style(closure): format worker 4 files"
            git push origin HEAD:closure/w4-server-policy
          fi
          git rev-parse HEAD

      - name: Reproduce three Task Route failures on frozen base
        continue-on-error: true
        run: |
          git checkout --detach 26ed6fcf30fd1f2f2473c29b7fcd5e736a91931e
          uv sync --extra dev --extra framework-comparison --extra server
          uv run pytest -q \
            tests/server/test_task_routes.py::test_owned_task_runtime_and_trace_store_close_on_server_shutdown \
            tests/server/test_task_routes.py::test_server_startup_recovers_incomplete_tool_actions_before_serving \
            tests/server/test_task_routes.py::test_lifespan_shutdown_is_idempotent_after_partial_cleanup_failure
