name: W4 Focused Validation

on:
  push:
    branches:
      - closure/w4-validation-temp

permissions:
  contents: read

jobs:
  final-static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: closure/w4-server-policy
          fetch-depth: 0

      - name: Verify final W4 head
        run: test "$(git rev-parse HEAD)" = "0ef71ef040946b940825601587759a393c91577c"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install targeted Ruff
        run: python -m pip install ruff==0.15.1

      - name: git diff --check W4 final head
        run: git diff --check 26ed6fcf30fd1f2f2473c29b7fcd5e736a91931e HEAD

      - name: Targeted Ruff check W4 final head
        run: >-
          ruff check
          src/openjarvis/tools/_stubs.py
          tests/security/test_tool_confirmation.py
          tests/server/test_legacy_action_gateway.py

      - name: Targeted Ruff format check W4 final head
        run: >-
          ruff format --check
          src/openjarvis/tools/_stubs.py
          tests/security/test_tool_confirmation.py
          tests/server/test_legacy_action_gateway.py
