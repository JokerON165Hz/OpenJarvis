name: W1 Cleanup Temporary Validation Workflows

on:
  push:
    branches:
      - closure/w1-action-safety

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current W1 branch
        uses: actions/checkout@v6
        with:
          ref: closure/w1-action-safety
          fetch-depth: 0

      - name: Remove temporary W1 validation workflows in one commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm \
            .github/workflows/w1-closeout-validation.yml \
            .github/workflows/w1-closeout-tests.yml \
            .github/workflows/w1-format-artifact.yml \
            .github/workflows/w1-apply-selective-format.yml \
            .github/workflows/w1-final-validation.yml
          git commit -m "chore: remove temporary w1 validation workflows"
          git push origin HEAD:closure/w1-action-safety
